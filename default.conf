# keyd config file for setup on mbp 2016
#

[ids]
*

[main]
# Caps Lock becomes Escape when tapped, activates [fn] layer when held
capslock = overload(nav, esc)

# Right Option/Alt activates the [nav] layer when held for navigation
rightalt = layer(fn)

[fn]
# Number row maps to F1-F12
1 = f1
2 = f2
3 = f3
4 = f4
5 = f5
6 = f6
7 = f7
8 = f8
9 = f9
0 = f10
- = f11
= = f12

# Screen brightness controls on the top letter row
q = brightnessdown
w = brightnessup

#Volume controls
. = volumeup 
, = volumedown

[nav]
# Vim-style navigation
h = left
j = down
k = up
l = right

# Page controls and line bounds wrapped tightly around HJKL
u = home
i = pageup
o = pagedown
p = end
